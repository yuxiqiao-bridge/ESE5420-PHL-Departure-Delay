name: Reproduce 5-fold checkpoint charts

on:
  push:
    paths:
      - '.github/workflows/reproduce-5fold.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install pandas numpy scikit-learn matplotlib requests
      - name: Reproduce five chronological folds and the checkpoint
        run: |
          python -m py_compile PHL_checkpoint_auto.py
          python PHL_checkpoint_auto.py --data PHL_2025_raw_departures.csv --out reproduced --folds 5 --bootstrap 400 --team "5420 Group; Yuxi, Jiayi, Xinyu" --code-url "https://github.com/yuxiqiao-bridge/ESE5420-PHL-Departure-Delay"
      - name: Update tracked output files when results change
        run: |
          cp reproduced/baseline.png baseline.png
          cp reproduced/feature_comparison.png feature_comparison.png
          cp reproduced/validation_results.csv validation_results.csv
          cp reproduced/CV_summary.csv CV_summary.csv
          cp reproduced/cv_fold_dates.csv cv_fold_dates.csv
          cp reproduced/C_validation_grid.csv C_validation_grid.csv
          cp reproduced/monthly_summary.csv monthly_summary.csv
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add baseline.png feature_comparison.png validation_results.csv CV_summary.csv cv_fold_dates.csv C_validation_grid.csv monthly_summary.csv
          if ! git diff --cached --quiet; then
            git commit -m "Regenerate figures and diagnostics with 5-fold chronological CV"
            git push
          fi
